# Traefik routing for https://amv.lefted.dev.
#
# k3s ships Traefik on :80/:443. Cloudflare proxies the host and already
# redirects plaintext at the edge ("Always Use HTTPS"); this Middleware is the
# backstop for any request that reaches the origin without going through it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: amv
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amv
  namespace: amv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Traefik addresses a Middleware CRD as <namespace>-<name>@kubernetescrd —
    # the namespace prefix is required, and a missing one fails open (no
    # redirect) rather than loudly.
    traefik.ingress.kubernetes.io/router.middlewares: amv-redirect-to-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - amv.lefted.dev
      secretName: lefted-wildcard-tls
  rules:
    # One host, one path: the app and its /api/v1/* live in the same process,
    # so everything goes to the same Service and nothing needs CORS.
    - host: amv.lefted.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: amv-tierlist
                port:
                  number: 80
---
# The service worker must never be served from a CDN cache.
#
# adapter-node sets Cache-Control only for the hashed files under
# /_app/immutable/. /sw.js has a fixed name and no header, so Cloudflare falls
# back to caching it by extension (.js) for hours. A browser's service-worker
# update check bypasses its own HTTP cache but not the edge's, so after a deploy
# every client kept the old worker, and the old worker kept answering
# navigations with its precached old shell (#21). `no-cache` at the origin is
# what Cloudflare honours; it also keeps the file revalidated by any other
# proxy in between.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sw-no-cache
  namespace: amv
spec:
  headers:
    customResponseHeaders:
      Cache-Control: 'no-cache, must-revalidate'
---
# A second Ingress because middlewares are attached per Ingress, not per path.
# Everything else still goes through the first Ingress unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amv-sw
  namespace: amv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Without this, Traefik ranks routers by rule length, and
    # `Host(...) && PathPrefix(`/`)` is one character longer than
    # `Host(...) && Path(`/sw.js`)`, so the catch-all above would win.
    traefik.ingress.kubernetes.io/router.priority: '100'
    traefik.ingress.kubernetes.io/router.middlewares: amv-redirect-to-https@kubernetescrd,amv-sw-no-cache@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - amv.lefted.dev
      secretName: lefted-wildcard-tls
  rules:
    - host: amv.lefted.dev
      http:
        paths:
          - path: /sw.js
            pathType: Exact
            backend:
              service:
                name: amv-tierlist
                port:
                  number: 80
